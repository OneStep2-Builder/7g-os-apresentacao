<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Oficina de Móveis 7G</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: oficina em três colunas — consola de pedidos | bancada 3D | peças e medidas. Empilha no telemóvel. */
:root{
  --bg:#f1ede6; --panel:#fffdf9; --panel-2:#f7f2ea; --line:#e2d8c8; --ink:#241a10; --muted:#7a6a58;
  --accent:#8c602a; --accent-ink:#fffaf2; --accent-soft:#f0e2c9; --sel:#d9a43a; --stage:#ebe4d8; --grid1:#cbbfac; --grid2:#ddd3c3;
  --ok:#3f7a52; --warn:#b26a1e;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140c06; --panel:#1e140b; --panel-2:#26190e; --line:#3a2a19; --ink:#f3e9da; --muted:#b09a7f;
  --accent:#c5a059; --accent-ink:#1a1006; --accent-soft:#3a2a15; --sel:#e8b84f; --stage:#1a120a; --grid1:#4c311a; --grid2:#2e1f11;
  --ok:#7fbf8e; --warn:#e2a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140c06; --panel:#1e140b; --panel-2:#26190e; --line:#3a2a19; --ink:#f3e9da; --muted:#b09a7f;
  --accent:#c5a059; --accent-ink:#1a1006; --accent-soft:#3a2a15; --sel:#e8b84f; --stage:#1a120a; --grid1:#4c311a; --grid2:#2e1f11;
  --ok:#7fbf8e; --warn:#e2a35a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}

.main{min-height:0;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr) minmax(300px,370px)}
.col{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.col.left{border-right:1px solid var(--line)}
.col.right{border-left:1px solid var(--line)}
.colhead{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* consola */
.log{flex:1;min-height:0;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13px;border-radius:10px;padding:9px 11px;max-width:100%;overflow-wrap:anywhere}
.msg.user{background:var(--accent-soft);align-self:flex-end;border-bottom-right-radius:3px}
.msg.sys{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.sys ul{margin:6px 0 0;padding-left:16px}
.msg .who{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.prompt{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.prompt textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 11px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.prompt .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:11.5px;color:var(--muted)}

/* palco 3D */
.stage{position:relative;min-height:0;background:var(--stage);overflow:hidden}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.tag{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.tag b{font-weight:700}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views .btn{padding:5px 9px;font-size:12px;background:var(--panel)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,12px)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}

/* painel direito */
.tabs{display:flex;gap:4px;padding:0 16px 8px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--panel-2);padding:6px;border-radius:8px;font-weight:600;font-size:12.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.insp{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;margin-bottom:12px}
.insp h3{margin:0;font-size:15px;line-height:1.25}
.insp .meta{font-size:12px;color:var(--muted);margin:2px 0 10px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 7px;font-size:13px;min-width:0}
.fld input[type=number]{font-family:var(--f-num)}
.insp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;margin-bottom:8px}
.grp{margin-top:10px}
.grp > .gh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:4px 2px;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.prow:hover{background:var(--panel-2)}
.prow.sel{background:var(--accent-soft)}
.prow.hid{opacity:.45}
.code{font-family:var(--f-num);font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px;border:1px solid var(--line);background:var(--panel-2)}
.code.A{border-style:dashed}
.pname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{color:var(--warn);font-weight:700;margin-left:4px}
.pdim{font-family:var(--f-num);font-size:11.5px;color:var(--muted);white-space:nowrap}
.eye{border:none;background:none;padding:2px 4px;color:var(--muted);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pgrid .fld.wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.sum{margin-top:14px;font-size:12.5px;color:var(--muted)}

/* folha de impressão */
#sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.72);overflow:auto;padding-bottom:40px}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-bar .sp{flex:1}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 16px}
/* o papel é sempre branco: é uma folha para imprimir */
.page{background:#fff;color:#1b140d;width:210mm;max-width:100%;min-height:297mm;padding:10mm 11mm 8mm;box-shadow:0 10px 40px rgba(0,0,0,.35);font:10.5px/1.4 var(--f-ui);display:flex;flex-direction:column;gap:8mm}
.page h1{font-size:20px;margin:0;letter-spacing:-.01em}
.page h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 3mm;border-bottom:1.5px solid #1b140d;padding-bottom:1.5mm}
.ph{display:grid;grid-template-columns:1fr auto;gap:4mm;border-bottom:2px solid #1b140d;padding-bottom:3mm}
.ph .r{text-align:right;font-family:var(--f-num);font-size:10px;color:#5b4a38}
.ph .sub{color:#5b4a38;font-size:11px;margin-top:1mm}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4mm}
.figs figure{margin:0;border:1px solid #d6cbbb;border-radius:2mm;overflow:hidden;background:#fff}
.figs img{display:block;width:100%;height:auto}
.figs figcaption{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1.5mm 2.5mm;border-top:1px solid #e6ddcf;display:flex;justify-content:space-between;color:#3d2f20}
.figs figcaption span{font-weight:500;letter-spacing:0;text-transform:none;color:#7a6a58}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2mm 6mm}
.kv div{border-bottom:1px solid #e6ddcf;padding:1mm 0}
.kv b{display:block;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:#7a6a58}
.kv span{font-family:var(--f-num);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:9.5px}
.tbl th{text-align:left;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b4a38;border-bottom:1.5px solid #1b140d;padding:1.2mm 1.5mm}
.tbl td{border-bottom:1px solid #e6ddcf;padding:1.1mm 1.5mm;vertical-align:top}
.tbl td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
.tbl tr{break-inside:avoid}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6mm}
.steps{margin:0;padding-left:5mm}
.steps li{margin-bottom:1.2mm}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:9px;color:#7a6a58;border-top:1px solid #d6cbbb;padding-top:2mm}
.tblwrap{overflow-x:auto}

@media (max-width: 1080px){
  .main{grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-rows:minmax(420px,62vh) auto}
  .col.left{grid-column:1/-1;grid-row:2;border-right:none;border-top:1px solid var(--line)}
  .stage{grid-column:1;grid-row:1}
  .col.right{grid-row:1}
  .app{height:auto;min-height:100%}
  .log{max-height:320px}
}
@media (max-width: 720px){
  .main{display:flex;flex-direction:column}
  .stage{height:58vh;min-height:340px;flex:none}
  .col.right{border-left:none;border-top:1px solid var(--line)}
  .pane{max-height:none;overflow:visible}
  .col.left{order:-1;border-top:none;border-bottom:1px solid var(--line)}
  .log{max-height:240px}
  .page{padding:6mm;min-height:0}
  .figs,.cols2{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .app{display:none!important}
  #sheetWrap{position:static;background:none;overflow:visible;padding:0}
  .sheet-bar{display:none!important}
  .pages{padding:0;gap:0;display:block}
  .page{box-shadow:none;width:210mm;min-height:297mm;max-width:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .figs{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:repeat(4,1fr)}
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Oficina de Móveis 7G</b><span id="projName">Mesa auxiliar de serviço</span></div>
    <div class="sp"></div>
    <button class="btn" id="btnExplode" type="button" aria-pressed="false">Vista explodida</button>
    <button class="btn" id="btnReset" type="button">Repor edições</button>
    <button class="btn" id="btnPdfTop" type="button">Descarregar PDF</button>
    <button class="btn pri" id="btnSheet" type="button">Folha de construção</button>
  </header>
  <div class="main">
    <section class="col left" aria-label="Consola de pedidos">
      <div class="colhead"><span class="eyebrow">Consola</span><button class="btn sm" id="btnClear" type="button">Limpar</button></div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="prompt" id="promptForm">
        <label class="eyebrow" for="promptIn">Descreve o móvel ou a alteração</label>
        <textarea id="promptIn" placeholder="Ex.: cria uma estante de 80 × 180 cm com 5 prateleiras"></textarea>
        <div class="chips" id="chips"></div>
        <div class="row"><span class="hint">Enter para gerar · Shift+Enter nova linha</span><button class="btn pri" type="submit">Gerar</button></div>
      </form>
    </section>

    <section class="stage" aria-label="Modelo 3D">
      <div id="view"></div>
      <div class="hud">
        <div class="tag" id="dimTag">—</div>
        <div class="views">
          <button class="btn" type="button" data-view="iso">3D</button>
          <button class="btn" type="button" data-view="front">Frente</button>
          <button class="btn" type="button" data-view="side">Lado</button>
          <button class="btn" type="button" data-view="top">Topo</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </section>

    <section class="col right" aria-label="Peças e medidas">
      <div class="colhead"><span class="eyebrow">Projeto</span><span class="hint num" id="countTag"></span></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabParts" aria-selected="true">Peças</button>
        <button type="button" role="tab" id="tabParams" aria-selected="false">Medidas gerais</button>
      </div>
      <div class="pane" id="paneParts">
        <div id="insp"></div>
        <input class="search" id="search" type="search" placeholder="Procurar peça (ex.: gaveta, balde, tampo)">
        <div id="plist"></div>
      </div>
      <div class="pane" id="paneParams" hidden></div>
    </section>
  </div>
</div>

<div id="sheetWrap" hidden>
  <div class="sheet-bar">
    <b>Folha de construção</b>
    <span class="hint" id="printHint"></span>
    <div class="sp"></div>
    <span class="hint" id="pdfStatus" role="status"></span>
    <button class="btn pri" id="btnPdf" type="button">Descarregar PDF</button>
    <button class="btn" id="btnPrint" type="button">Imprimir</button>
    <button class="btn" id="btnCloseSheet" type="button">Fechar</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
"use strict";

/* ===================== MATERIAIS ===================== */
const MATS = {
  betula:   {nome:"Contraplacado de bétula", cor:0xdcc49a, tipo:"chapa"},
  carvalho: {nome:"Carvalho lamelado (envernizado)", cor:0xa0703f, tipo:"chapa"},
  lacado:   {nome:"MDF hidrófugo lacado verde-café", cor:0x3e6a5a, tipo:"chapa"},
  lacadoB:  {nome:"MDF hidrófugo lacado branco", cor:0xeeeae2, tipo:"chapa"},
  lacadoP:  {nome:"MDF hidrófugo lacado preto", cor:0x2a2622, tipo:"chapa"},
  macico:   {nome:"Pinho maciço", cor:0xd8b47a, tipo:"chapa"},
  hdf:      {nome:"HDF", cor:0x9b8566, tipo:"chapa"},
  inox:     {nome:"Aço inox", cor:0xb9c0c4, tipo:"acc", metal:.55, rough:.35},
  branco:   {nome:"Branco (papel / cerâmica)", cor:0xf6f4ef, tipo:"acc"},
  preto:    {nome:"Preto", cor:0x2b2826, tipo:"acc"},
  azeite:   {nome:"Vidro — azeite", cor:0x8f9440, tipo:"acc", rough:.3},
  vinagre:  {nome:"Vidro — vinagre", cor:0x6a2a35, tipo:"acc", rough:.3},
  borracha: {nome:"Borracha", cor:0x34302c, tipo:"acc"}
};
const CHAPAS = Object.keys(MATS).filter(k=>MATS[k].tipo==="chapa");

/* ===================== AJUDAS ===================== */
const R = v => Math.round(v);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
function part(list, id, nome, grupo, mat, x,y,z, w,h,d, extra){
  list.push(Object.assign({id,nome,grupo,mat,x,y,z,w:Math.max(1,w),h:Math.max(1,h),d:Math.max(1,d),forma:"caixa",tipo:"corte",orla:""}, extra||{}));
}
function acc(list,id,nome,grupo,mat,x,y,z,w,h,d,extra){ part(list,id,nome,grupo,mat,x,y,z,w,h,d,Object.assign({tipo:"acessorio"},extra||{})); }
function ferr(list,id,nome,grupo,mat,x,y,z,w,h,d,extra){ part(list,id,nome,grupo,mat,x,y,z,w,h,d,Object.assign({tipo:"ferragem"},extra||{})); }
const fmt = n => String(R(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");

/* ===================== MODELO: MESA AUXILIAR DE SERVIÇO ===================== */
const GAVETAS = [
  {nome:"Talheres", k:4, nota:"Garfos · facas · colheres de sopa · colheres de sobremesa"},
  {nome:"Colheres de café", k:3, nota:"Colheres de café · pacotes de açúcar · mexedores"},
  {nome:"Guardanapos", k:2, nota:"Guardanapos de papel e de pano"},
  {nome:"Utensílios", k:3, nota:"Abre-garrafas · pinças · blocos de pedidos"},
  {nome:"Reserva", k:1, nota:"Arrumação geral"}
];
const CORREDICAS=[250,300,350,400,450,500,550,600];

function genEstacao(p){
  const L=[]; const W=p.W, H=p.H, D=p.D, t=p.t, tt=p.tampoE, pl=p.plinto, c=6;
  const n=clamp(Math.round(p.nGavetas),1,6);
  const mC=p.matCorpo, mT=p.matTampo, mF=p.matFrentes;
  const latY = p.rodas ? pl : 0;
  const yTop = H-tt;                     // face inferior do tampo
  const yGav = yTop - p.gavetaH;         // fundo da zona de gavetas
  const y1 = yGav - t;                   // face inferior da prateleira fixa sob gavetas
  const y0 = pl + t;                     // face superior da base

  // Estrutura
  part(L,"lat-e","Lateral esquerda","Estrutura",mC,0,latY,0,t,yTop-latY,D,{orla:"frente"});
  part(L,"lat-d","Lateral direita","Estrutura",mC,W-t,latY,0,t,yTop-latY,D,{orla:"frente"});
  part(L,"base","Base","Estrutura",mC,t,pl,c,W-2*t,t,D-c,{orla:"frente"});
  part(L,"costas","Costas","Estrutura","hdf",t,pl,0,W-2*t,yTop-pl,c,{nota:"Encaixe em rasgo ou aparafusada"});
  part(L,"trav-sup","Travessa superior traseira","Estrutura",mC,t,yTop-100,c,W-2*t,100,t,{nota:"Fixa o tampo e esquadra o corpo"});
  part(L,"prat-gav","Prateleira fixa sob gavetas","Estrutura",mC,t,y1,c,W-2*t,t,D-c,{orla:"frente"});
  if(!p.rodas){
    part(L,"rodape","Rodapé frontal","Estrutura",mC,t,0,D-50-t,W-2*t,pl,t,{nota:"Recuado 50 mm (espaço para os pés)"});
    part(L,"rodape-t","Rodapé traseiro","Estrutura",mC,t,0,c+10,W-2*t,pl,t);
  }

  // Tampo
  const bal=p.balanco;
  part(L,"tampo","Tampo de trabalho","Tampo",mT,-bal,yTop,0,W+2*bal,tt,D+t+12,{orla:mT==="carvalho"||mT==="macico"?"— (maciço, boleado 3 mm)":"4 lados",nota:"Balanço lateral "+bal+" mm"});

  // Zona de gavetas
  const Wi=W-2*t, bw=(Wi-(n-1)*t)/n;
  const slide = CORREDICAS.filter(s=>s<=D-c-12).pop()||250;
  const fw=(W-3*(n+1))/n;
  for(let i=0;i<n;i++){
    const bx=t+i*(bw+t);
    if(i<n-1) part(L,"div-gav-"+(i+1),"Divisória entre gavetas "+(i+1)+"/"+(i+2),"Estrutura",mC,bx+bw,yGav,c,t,p.gavetaH,D-c,{orla:"frente"});
    const g=GAVETAS[Math.min(i,GAVETAS.length-1)];
    const G="Gaveta "+(i+1)+" · "+g.nome;
    const fx=3+i*(fw+3), fy=yGav-t/2+2, fh=(yTop-2)-fy;
    part(L,"g"+(i+1)+"-frente","Frente da gaveta "+(i+1),G,mF,fx,fy,D,fw,fh,t,{orla:"4 lados",nota:g.nota});
    ferr(L,"g"+(i+1)+"-pux","Puxador gaveta "+(i+1),G,"inox",fx+fw/2-Math.min(160,fw*.45)/2,fy+fh/2-6,D+t,Math.min(160,fw*.45),12,22,{nota:"Puxador barra inox, entre-eixos 128 mm"});
    const tg=15, bwb=bw-26, bh=p.gavetaH-35, by=yGav+10, z0=D-slide, x0=bx+13;
    part(L,"g"+(i+1)+"-lat-e","Lateral esq. gaveta "+(i+1),G,"betula",x0,by,z0,tg,bh,slide,{orla:"topo"});
    part(L,"g"+(i+1)+"-lat-d","Lateral dir. gaveta "+(i+1),G,"betula",x0+bwb-tg,by,z0,tg,bh,slide,{orla:"topo"});
    part(L,"g"+(i+1)+"-tras","Traseira gaveta "+(i+1),G,"betula",x0+tg,by,z0,bwb-2*tg,bh,tg,{orla:"topo"});
    part(L,"g"+(i+1)+"-contra","Contrafrente gaveta "+(i+1),G,"betula",x0+tg,by,D-tg,bwb-2*tg,bh,tg,{orla:"topo"});
    part(L,"g"+(i+1)+"-fundo","Fundo gaveta "+(i+1),G,"hdf",x0+tg-8,by+8,z0+tg-8,bwb-2*tg+16,6,slide-2*tg+16,{nota:"Em rasgo de 8 mm"});
    const iw=bwb-2*tg, k=g.k, cw=(iw-(k-1)*8)/k;
    for(let j=0;j<k-1;j++){
      part(L,"g"+(i+1)+"-sep-"+(j+1),"Separador "+(j+1)+" gaveta "+(i+1),G,"betula",x0+tg+(j+1)*cw+j*8,by+14,z0+tg,8,Math.max(20,bh-35),slide-2*tg,{nota:"Organizador — "+g.nome.toLowerCase()});
    }
    ferr(L,"g"+(i+1)+"-corr","Corrediças "+slide+" mm (par) gaveta "+(i+1),G,"inox",x0-12,by+10,z0,bwb+24,4,slide,{invisivel:true,nota:"Telescópicas, extração total, 30 kg"});
  }

  // Zona inferior
  const lh=y1-y0;
  const divX=t+Wi*clamp(p.divisao,20,80)/100-t/2;
  part(L,"div-inf","Divisória inferior","Zona inferior",mC,divX,y0,c,t,lh,D-c,{orla:"frente"});
  part(L,"prat-e","Prateleira do nicho aberto","Zona inferior",mC,t,y0+lh/2-t/2,c,divX-t,t,D-c-20,{orla:"frente",nota:"Tabuleiros de serviço, cestos de pão, jarros"});
  const doorsOn=!!p.portas;
  part(L,"prat-d","Prateleira do armário","Zona inferior",mC,divX+t,y0+lh/2-t/2,c,W-t-(divX+t),t,D-c-(doorsOn?30:20),{orla:"frente",nota:"Regulável — suportes de 5 mm"});
  // acessórios do nicho
  const nW=divX-t;
  const trW=Math.min(380,nW-40), trD=Math.min(480,D-c-40);
  for(let k=0;k<3;k++) acc(L,"tab-"+(k+1),"Tabuleiro de serviço "+(k+1),"Acessórios · nicho","inox",t+(nW-trW)/2,y0+lh/2+t/2+k*8,c+20,trW,6,trD);
  const jr=Math.min(120,nW/3);
  acc(L,"jarro-1","Jarro de água 1","Acessórios · nicho","inox",t+30,y0,D-c-jr-40,jr,Math.min(220,lh/2-30),jr,{forma:"cil",taper:.9});
  acc(L,"jarro-2","Jarro de água 2","Acessórios · nicho","inox",t+60+jr,y0,D-c-jr-40,jr,Math.min(220,lh/2-30),jr,{forma:"cil",taper:.9});

  if(doorsOn){
    const rx0=divX+t/2+1.5, rW=W-1.5-rx0, nd=rW>620?2:1, dw=(rW-3*(nd-1))/nd;
    const dy=pl+2, dh=(y1+t/2-2)-dy;
    for(let k=0;k<nd;k++){
      const x=rx0+k*(dw+3);
      part(L,"porta-"+(k+1),"Porta "+(k+1),"Portas",mF,x,dy,D,dw,dh,t,{orla:"4 lados",nota:"Armário para bules, menus, toalhas e reservas"});
      const hx = nd===2 ? (k===0? x+dw-40 : x+28) : x+28;
      ferr(L,"porta-"+(k+1)+"-pux","Puxador porta "+(k+1),"Portas","inox",hx,dy+dh-40-128,D+t,12,Math.min(160,dh*.4),22);
    }
  }

  // Alçado
  if(p.alcado){
    const aH=p.alcadoH, aD=Math.min(p.alcadoD,D), yA=H, topA=H+aH;
    const AG="Alçado";
    part(L,"alc-lat-e","Lateral esq. do alçado",AG,mC,0,yA,0,t,aH-t,aD,{orla:"frente"});
    part(L,"alc-lat-d","Lateral dir. do alçado",AG,mC,W-t,yA,0,t,aH-t,aD,{orla:"frente"});
    part(L,"alc-cimo","Cimo do alçado",AG,mC,0,topA-t,0,W,t,aD,{orla:"frente + topos"});
    part(L,"alc-costas","Costas do alçado",AG,"hdf",t,yA,0,W-2*t,aH-t,c);
    const compH=Math.round((aH-t)*0.58);
    const shY=yA+compH;
    part(L,"alc-prat","Prateleira do alçado",AG,mC,t,shY,c,W-2*t,t,aD-c,{orla:"frente",nota:"Açucareiros, palhinhas, menus"});
    const xa=t+Wi*0.4-t/2, xb=t+Wi*0.6-t/2;
    part(L,"alc-div-1","Divisória temperos | guardanapos",AG,mC,xa,yA,c,t,compH,aD-c,{orla:"frente"});
    part(L,"alc-div-2","Divisória guardanapos | baldes",AG,mC,xb,yA,c,t,compH,aD-c,{orla:"frente"});
    const dz=aD-c;

    // Temperos
    const nt=clamp(Math.round(p.nTemperos),0,10), sW=xa-t;
    if(nt>0){
      const cwid=Math.min(160,(sW-10*(nt+1))/nt), cdep=Math.min(150,dz-16);
      for(let i=0;i<nt;i++){
        const x=t+10+i*(cwid+10), z=c+(dz-cdep)/2, GT="Acessórios · temperos";
        acc(L,"galh-"+(i+1),"Galheteiro "+(i+1)+" (tabuleiro)",GT,"carvalho",x,yA,z,cwid,14,cdep,{nota:"Leva sal, pimenta, azeite e vinagre à mesa"});
        const r=Math.min(cwid,cdep)/2-8, sd=Math.min(38,r*0.85), bd=Math.min(46,r*0.95), hmax=compH-30;
        const q=[[.27,.3,"sal","Saleiro","branco",sd,Math.min(75,hmax)],[.73,.3,"pim","Pimenteiro","preto",sd,Math.min(75,hmax)],
                 [.27,.72,"az","Azeite","azeite",bd,Math.min(150,hmax)],[.73,.72,"vin","Vinagre","vinagre",bd,Math.min(150,hmax)]];
        q.forEach(e=>acc(L,"galh-"+(i+1)+"-"+e[2],e[3]+" "+(i+1),GT,e[4],x+cwid*e[0]-e[5]/2,yA+14,z+cdep*e[1]-e[5]/2,e[5],e[6],e[5],{forma:"cil",taper:1}));
      }
    }
    // Guardanapos
    const gW=xb-(xa+t);
    acc(L,"guard","Guardanapos (pilha)","Acessórios · guardanapos","branco",xa+t+(gW-Math.min(gW-20,170))/2,yA,c+10,Math.min(gW-20,170),Math.min(compH-30,110),Math.min(dz-20,170));
    // Baldes de talheres
    const nb=clamp(Math.round(p.nBaldes),0,16), bW=W-t-(xb+t);
    if(nb>0){
      let rows=1, per=nb, dia=Math.min(110,(bW-10*(per+1))/per);
      if(dia<75 && dz>=2*80+30){ rows=2; per=Math.ceil(nb/2); dia=Math.min(110,(bW-10*(per+1))/per,(dz-10*3)/2); }
      dia=Math.max(40,dia);
      const bh=Math.min(140,compH-25);
      for(let i=0;i<nb;i++){
        const row=Math.floor(i/per), col=i%per;
        const z = rows===1 ? c+(dz-dia)/2 : c+10+row*(dia+10);
        acc(L,"balde-"+(i+1),"Balde de talheres "+(i+1),"Acessórios · baldes","inox",xb+t+10+col*(dia+10),yA,z,dia,bh,dia,{forma:"cil",taper:.82,nota:"Leva os talheres às mesas"});
      }
    }
    // Utensílios na prateleira do alçado
    const upH=topA-t-(shY+t), uy=shY+t;
    if(upH>40){
      const ad=Math.min(80,dz-20);
      acc(L,"acuc-1","Açucareiro 1","Acessórios · utensílios","branco",t+40,uy,c+(dz-ad)/2,ad,Math.min(95,upH-15),ad,{forma:"cil",taper:1.05});
      acc(L,"acuc-2","Açucareiro 2","Acessórios · utensílios","branco",t+60+ad,uy,c+(dz-ad)/2,ad,Math.min(95,upH-15),ad,{forma:"cil",taper:1.05});
      acc(L,"palh","Porta-palhinhas","Acessórios · utensílios","inox",W/2-35,uy,c+(dz-70)/2,70,Math.min(130,upH-10),70,{forma:"cil"});
      acc(L,"menus","Porta-menus","Acessórios · utensílios","carvalho",W-t-260,uy,c+(dz-60)/2,220,Math.min(120,upH-10),60);
    }
  }

  // Apoio no chão
  if(p.rodas){
    [[45,45],[W-45,45],[45,D-45],[W-45,D-45]].forEach((q,i)=>ferr(L,"rod-"+(i+1),"Rodízio "+(i+1)+(i<2?"":" (com travão)"),"Ferragens","borracha",q[0]-35,0,q[1]-35,70,pl,70,{forma:"cil",nota:"Ø75 mm, giratório, placa 4 furos"}));
  } else {
    [[t/2,30],[W-t/2,30],[t/2,D-30],[W-t/2,D-30]].forEach((q,i)=>ferr(L,"sap-"+(i+1),"Sapata niveladora "+(i+1),"Ferragens","borracha",q[0]-12,-1,q[1]-12,24,4,24,{forma:"cil",nota:"Regulável ±15 mm"}));
  }
  return L;
}
function extrasEstacao(p){
  const e=[{view:"front",a:[p.W+p.balanco,0,p.D],b:[p.W+p.balanco,p.H,p.D],side:"right",label:"Altura de trabalho "+p.H}];
  if(p.alcado) e.push({view:"side",a:[0,p.H,0],b:[0,p.H+p.alcadoH,0],side:"far",label:"Alçado "+p.alcadoH});
  return e;
}

/* ===================== MODELO: ESTANTE ===================== */
function genEstante(p){
  const L=[], {W,H,D,t}=p, c=6, pl=p.plinto, n=clamp(Math.round(p.nPrateleiras),0,12), m=p.matCorpo;
  part(L,"lat-e","Lateral esquerda","Estrutura",m,0,0,0,t,H,D,{orla:"frente"});
  part(L,"lat-d","Lateral direita","Estrutura",m,W-t,0,0,t,H,D,{orla:"frente"});
  part(L,"cimo","Cimo","Estrutura",m,t,H-t,0,W-2*t,t,D,{orla:"frente"});
  part(L,"base","Base","Estrutura",m,t,pl,c,W-2*t,t,D-c,{orla:"frente"});
  part(L,"rodape","Rodapé","Estrutura",m,t,0,D-30-t,W-2*t,pl,t);
  if(p.costas) part(L,"costas","Costas","Estrutura","hdf",t,pl,0,W-2*t,H-t-pl,c);
  const yb=pl+t, yt=H-t, gap=(yt-yb-n*t)/(n+1);
  for(let i=0;i<n;i++) part(L,"prat-"+(i+1),"Prateleira "+(i+1),"Prateleiras",m,t+1,yb+gap*(i+1)+t*i,c,W-2*t-2,t,D-c-10,{orla:"frente",nota:"Regulável — suportes de 5 mm"});
  ferr(L,"fix","Esquadro anti-queda","Ferragens","inox",W/2-20,H-60,-2,40,40,2,{nota:"Fixar à parede"});
  return L;
}
/* ===================== MODELO: MESA ===================== */
function genMesa(p){
  const L=[], {W,D,H}=p, tt=p.tampoE, pe=p.perna, r=p.recuo, a=p.aro, at=22;
  part(L,"tampo","Tampo","Tampo",p.matTampo,0,H-tt,0,W,tt,D,{orla:"4 lados"});
  [[r,r],[W-r-pe,r],[r,D-r-pe],[W-r-pe,D-r-pe]].forEach((q,i)=>part(L,"perna-"+(i+1),"Perna "+(i+1),"Estrutura",p.matEstrutura,q[0],0,q[1],pe,H-tt,pe));
  const ya=H-tt-a, zf=r+(pe-at)/2, xl=r+(pe-at)/2;
  part(L,"aro-f","Aro frontal","Estrutura",p.matEstrutura,r+pe,ya,D-r-pe+(pe-at)/2,W-2*(r+pe),a,at);
  part(L,"aro-t","Aro traseiro","Estrutura",p.matEstrutura,r+pe,ya,zf,W-2*(r+pe),a,at);
  part(L,"aro-e","Aro lateral esq.","Estrutura",p.matEstrutura,xl,ya,r+pe,at,a,D-2*(r+pe));
  part(L,"aro-d","Aro lateral dir.","Estrutura",p.matEstrutura,W-r-pe+(pe-at)/2,ya,r+pe,at,a,D-2*(r+pe));
  [[r,r],[W-r-pe,r],[r,D-r-pe],[W-r-pe,D-r-pe]].forEach((q,i)=>ferr(L,"sap-"+(i+1),"Sapata "+(i+1),"Ferragens","borracha",q[0]+pe/2-12,-1,q[1]+pe/2-12,24,4,24,{forma:"cil"}));
  return L;
}
/* ===================== MODELO: BANCO ===================== */
function genBanco(p){
  const L=[], {W,D,H}=p, st=p.assentoE, pe=p.perna, tv=p.travessaY, ts=20;
  part(L,"assento","Assento","Assento",p.matTampo,0,H-st,0,W,st,D,{orla:"4 lados"});
  const P=[[0,0],[W-pe,0],[0,D-pe],[W-pe,D-pe]];
  P.forEach((q,i)=>part(L,"perna-"+(i+1),"Perna "+(i+1),"Estrutura",p.matEstrutura,q[0]+10,0,q[1]+10,pe,H-st,pe));
  part(L,"trav-f","Travessa frontal","Estrutura",p.matEstrutura,pe+10,tv,D-pe-10+(pe-ts)/2,W-2*pe-20,40,ts);
  part(L,"trav-t","Travessa traseira","Estrutura",p.matEstrutura,pe+10,tv,10+(pe-ts)/2,W-2*pe-20,40,ts);
  part(L,"trav-e","Travessa lateral esq.","Estrutura",p.matEstrutura,10+(pe-ts)/2,tv+60,pe+10,ts,40,D-2*pe-20);
  part(L,"trav-d","Travessa lateral dir.","Estrutura",p.matEstrutura,W-pe-10+(pe-ts)/2,tv+60,pe+10,ts,40,D-2*pe-20);
  return L;
}

const KEY="oficina-moveis-7g.v1";
let state=null;
function fresh(tpl){ return {tpl, params:Object.assign({},TPL[tpl].def), ov:{}, log:[]}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s && TPL[s.tpl]) { s.params=Object.assign({},TPL[s.tpl].def,s.params); return s; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

let parts=[]; let selId=null;
function compute(){
  const T=TPL[state.tpl];
  const base=T.gen(state.params);
  let nc=0,na=0,nf=0;
  const gi=new Map(); base.forEach(p=>{ if(!gi.has(p.grupo)) gi.set(p.grupo,gi.size); });
  const ord=base.map((p,i)=>[p,i]).sort((a,b)=>(gi.get(a[0].grupo)-gi.get(b[0].grupo))||(a[1]-b[1])).map(x=>x[0]);
  parts=ord.map(p=>{
    const o=state.ov[p.id]; const q=Object.assign({},p);
    q.orig={w:p.w,h:p.h,d:p.d,mat:p.mat};
    if(o){
      if(o.w!=null) q.w=o.w; if(o.h!=null) q.h=o.h; if(o.d!=null) q.d=o.d;
      q.x+=o.dx||0; q.y+=o.dy||0; q.z+=o.dz||0;
      if(o.mat) q.mat=o.mat; q.oculta=!!o.oculta;
      q.editada = o.w!=null||o.h!=null||o.d!=null||!!o.dx||!!o.dy||!!o.dz||!!o.mat;
    }
    if(q.tipo==="corte") q.code="P"+String(++nc).padStart(2,"0");
    else if(q.tipo==="acessorio") q.code="A"+String(++na).padStart(2,"0");
    else q.code="F"+String(++nf).padStart(2,"0");
    return q;
  });
}

/* ===================== INTERPRETADOR DE PEDIDOS ===================== */
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function toMM(v,u){ v=parseFloat(String(v).replace(",",".")); if(!u) return v; u=u[0]==="m"&&u.slice(0,2)!=="mm"&&u.slice(0,3)!=="mil" ? "m" : (u.startsWith("c")?"cm":"mm"); return u==="m"?v*1000:u==="cm"?v*10:v; }
function parsePrompt(txt){
  let s=" "+norm(txt)+" ";
  const out={tipo:null,set:{},notes:[],cria:/\b(cria|criar|crie|faz|fazer|faca|constroi|construir|desenha|desenhar|gera|gerar|quero|novo|nova|preciso)\b/.test(s)};
  if(/\b(mesa auxiliar|auxiliar|estacao de servico|estacao do empregado|movel de (apoio|servico)|aparador|buffet|restauracao|cafetaria|talheres|empregado)\b/.test(s)) out.tipo="estacao";
  else if(/\b(estante|livreiro|biblioteca)\b/.test(s)) out.tipo="estante";
  else if(/\b(banco|banqueta|banquinho|mocho)\b/.test(s)) out.tipo="banco";
  else if(/\bmesa\b/.test(s)) out.tipo="mesa";

  // expressões por extenso
  s=s.replace(/\b(um|1) metro e meio\b/g," 1500mm ").replace(/\bmeio metro\b/g," 500mm ").replace(/\bdois metros\b/g," 2000mm ").replace(/\bum metro\b/g," 1000mm ");
  const dims=[];
  const tri=s.match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)\s*(mm|cm|m)?\b/);
  if(tri){
    let u=tri[4]; const vals=[tri[1],tri[2],tri[3]].map(v=>parseFloat(v.replace(",",".")));
    if(!u) u = Math.max(...vals)<10?"m":Math.max(...vals)<400?"cm":"mm";
    const mm=vals.map(v=>toMM(v,u));
    out.set.W=mm[0]; out.set.D=mm[1]; out.set.H=mm[2];
    s=s.replace(tri[0]," ");
  } else {
    const duo=s.match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)\s*(mm|cm|m)?\b/);
    if(duo){
      let u=duo[3]; const vals=[duo[1],duo[2]].map(v=>parseFloat(v.replace(",",".")));
      if(!u) u = Math.max(...vals)<10?"m":Math.max(...vals)<400?"cm":"mm";
      const mm=vals.map(v=>toMM(v,u)); const tp=out.tipo||state.tpl;
      out.set.W=mm[0]; if(tp==="estante") out.set.H=mm[1]; else out.set.D=mm[1];
      s=s.replace(duo[0]," ");
    }
  }
  const re=/(\d+(?:[.,]\d+)?)\s*(mm|milimetros?|cm|centimetros?|metros?|m)(?![a-z])/g; let m;
  const KW=[["H",/(altura( de trabalho)?|alto|alta|altos)\s*(de|com|a)?\s*$/],["D",/(profundidade|fundo|funda|profunda)\s*(de|com)?\s*$/],["W",/(largura|comprimento|comprida|comprido|larga|largo)\s*(de|com)?\s*$/],
            ["t",/(espessura|grossura|chapa)\s*(de|com)?\s*$/],["gavetaH",/gavetas?\s*(de|com)?\s*$/],["alcadoH",/(alcado|parte de cima|parte superior)\s*(de|com)?\s*$/],["tampoE",/tampo\s*(de|com)?\s*$/],["plinto",/(rodape|plinto)\s*(de|com)?\s*$/]];
  const KWA=[["H",/^\s*(de )?(altura|alto|alta)/],["D",/^\s*(de )?(profundidade|fundo)/],["W",/^\s*(de )?(largura|comprimento)/],["t",/^\s*(de )?espessura/]];
  const untagged=[];
  while((m=re.exec(s))){
    const val=toMM(m[1],m[2]); const before=s.slice(Math.max(0,m.index-32),m.index); const after=s.slice(m.index+m[0].length,m.index+m[0].length+22);
    let k=null;
    for(const [kk,r] of KWA) if(r.test(after)){k=kk;break;}
    if(!k) for(const [kk,r] of KW) if(r.test(before)){k=kk;break;}
    if(k) out.set[k]=val; else untagged.push(val);
  }
  ["W","D","H"].forEach(k=>{ if(out.set[k]==null && untagged.length) out.set[k]=untagged.shift(); });
  dims.push(...untagged);

  const cre=/\b(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze)\s+(?:[a-z]+\s+){0,2}?(baldes?|gavetas?|prateleiras?|galheteiros?|temperos?|portas?)\b/g;
  while((m=cre.exec(s))){
    const n=isNaN(+m[1])?NUMW[m[1]]:+m[1]; const w=m[2];
    if(w.startsWith("balde")) out.set.nBaldes=n;
    else if(w.startsWith("gaveta")) out.set.nGavetas=n;
    else if(w.startsWith("prateleira")) out.set.nPrateleiras=n;
    else if(w.startsWith("galheteiro")||w.startsWith("tempero")) out.set.nTemperos=n;
    else if(w.startsWith("porta")) out.set.portas=n>0;
  }
  if(/\bsem (rodas|rodizios|rodinhas)\b/.test(s)) out.set.rodas=false; else if(/\b(rodas|rodizios|rodinhas|movel sobre rodas)\b/.test(s)) out.set.rodas=true;
  if(/\bsem (alcado|parte de cima|parte superior|prateleira superior)\b/.test(s)) out.set.alcado=false; else if(/\b(com alcado|alcado|parte de cima)\b/.test(s)) out.set.alcado=true;
  if(/\bsem portas\b/.test(s)) out.set.portas=false;
  if(/\bsem costas\b/.test(s)) out.set.costas=false;
  // materiais
  const corMat = /\b(frentes?|portas?)\b[^.]*?\b(verdes?|brancas?|pretas?|carvalho|betula)\b/.exec(s);
  if(corMat){ const c=corMat[2]; out.set.matFrentes = c.startsWith("verde")?"lacado":c.startsWith("branc")?"lacadoB":c.startsWith("pret")?"lacadoP":c==="carvalho"?"carvalho":"betula"; }
  if(/\btampo (em |de )?(carvalho|madeira macica)\b/.test(s)) out.set.matTampo="carvalho";
  if(/\btampo (em |de )?(betula|contraplacado)\b/.test(s)) out.set.matTampo="betula";
  if(/\b(corpo|estrutura|tudo) (em |de )?(carvalho)\b/.test(s)) { out.set.matCorpo="carvalho"; out.set.matEstrutura="carvalho"; }
  if(/\b(corpo|estrutura|tudo) (em |de )?(betula|contraplacado)\b/.test(s)) { out.set.matCorpo="betula"; }
  if(/\b(corpo|estrutura|tudo) (em |de )?pinho\b/.test(s)) { out.set.matCorpo="macico"; out.set.matEstrutura="macico"; }
  // menções de funções (informativas)
  ["talheres","colheres de cafe","guardanapos","baldes","temperos","sal"].forEach(w=>{ if(s.includes(w)) out.notes.push(w); });
  return out;
}
const LABEL={W:"largura",H:"altura",D:"profundidade",t:"espessura da chapa",gavetaH:"altura das gavetas",alcadoH:"altura do alçado",tampoE:"espessura do tampo",plinto:"rodapé",
  nBaldes:"baldes de talheres",nGavetas:"gavetas",nPrateleiras:"prateleiras",nTemperos:"galheteiros",portas:"portas",rodas:"rodízios",alcado:"alçado",costas:"costas",matFrentes:"frentes",matTampo:"tampo",matCorpo:"corpo",matEstrutura:"estrutura"};
function describeVal(k,v){ if(typeof v==="boolean") return v?"sim":"não"; if(/^mat/.test(k)) return MATS[v].nome; if(/^n[A-Z]/.test(k)) return String(v); return fmt(v)+" mm"; }

function runPrompt(txt,force){
  const r=parsePrompt(txt);
  const changes=[]; let created=false;
  const switching = r.tipo && (r.tipo!==state.tpl || r.cria || force);
  if(switching){ const log=state.log; state=fresh(r.tipo); state.log=log; created=true; selId=null; }
  const T=TPL[state.tpl]; const ignored=[];
  for(const [k,v] of Object.entries(r.set)){
    const sc=T.schema.find(f=>f.k===k);
    if(!sc){ if(!(k==="matEstrutura"||k==="matCorpo")) ignored.push(LABEL[k]||k); continue; }
    let val=v; if(sc.min!=null && typeof v==="number") val=clamp(Math.round(v),sc.min,sc.max);
    state.params[k]=val; changes.push(LABEL[k]+": "+describeVal(k,val)+(val!==v&&typeof v==="number"?" (ajustado ao limite)":""));
  }
  compute();
  const ncut=parts.filter(p=>p.tipo==="corte").length;
  let head;
  if(created) head="Criei: "+T.nome.toLowerCase()+" — "+summary()+".";
  else if(changes.length) head="Atualizei o projeto — "+summary()+".";
  else head="Não encontrei medidas nem alterações neste pedido. Experimenta, por exemplo, «largura 1800 mm», «com rodas», «8 baldes» ou «cria uma estante de 80 × 180 cm».";
  const li=changes.map(c=>"<li>"+esc(c)+"</li>").join("");
  let extra="";
  if(created && state.tpl==="estacao") extra="<li>Gavetas com organizador: "+GAVETAS.slice(0,state.params.nGavetas).map(g=>g.nome.toLowerCase()).join(", ")+"</li><li>Alçado com galheteiros (sal, pimenta, azeite, vinagre), guardanapos e baldes de talheres</li><li>Nicho aberto para tabuleiros e armário com portas para outros utensílios</li>";
  if(ignored.length) extra+="<li>Não se aplica a este móvel: "+esc(ignored.join(", "))+"</li>";
  addMsg("sys",esc(head)+((li||extra)?"<ul>"+li+extra+"</ul>":"")+"<div class='hint' style='margin-top:6px'>"+ncut+" peças de corte · seleciona qualquer peça para mudar as medidas.</div>");
  rebuild(created);
}
function summary(){
  const p=state.params;
  if(state.tpl==="estacao") return fmt(p.W)+" × "+fmt(p.D)+" mm, altura de trabalho "+fmt(p.H)+" mm, "+p.nGavetas+" gavetas"+(p.alcado?", alçado de "+fmt(p.alcadoH)+" mm com "+p.nBaldes+" baldes e "+p.nTemperos+" galheteiros":"")+(p.rodas?", sobre rodízios":"");
  if(state.tpl==="estante") return fmt(p.W)+" × "+fmt(p.D)+" × "+fmt(p.H)+" mm com "+p.nPrateleiras+" prateleiras";
  return fmt(p.W)+" × "+fmt(p.D)+" × "+fmt(p.H)+" mm";
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function bbox(list){
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  list.forEach(p=>{ mn[0]=Math.min(mn[0],p.x); mn[1]=Math.min(mn[1],p.y); mn[2]=Math.min(mn[2],p.z); mx[0]=Math.max(mx[0],p.x+p.w); mx[1]=Math.max(mx[1],p.y+p.h); mx[2]=Math.max(mx[2],p.z+p.d); });

}

function fitCamera(dir,cam,aspect){
  cam=cam||camera; aspect=aspect||(cam.aspect||1);
  const box=new THREE.Box3().setFromObject(group); const sph=box.getBoundingSphere(new THREE.Sphere());
  const fov=cam.fov*Math.PI/180; const fovH=2*Math.atan(Math.tan(fov/2)*aspect);
  const dist=sph.radius/Math.sin(Math.min(fov,fovH)/2)*1.02;
  const d=new THREE.Vector3(...dir).normalize();
  cam.position.copy(sph.center).addScaledVector(d,dist);
  cam.near=dist/50; cam.far=dist*20; cam.updateProjectionMatrix(); cam.lookAt(sph.center);
  if(cam===camera){ controls.target.copy(sph.center); controls.update(); }
}

function renderList(){

function cutRows(){
  const rows=new Map();
  parts.filter(p=>p.tipo==="corte"&&!p.oculta).forEach(p=>{
    const s=[p.w,p.h,p.d].map(R).sort((a,b)=>b-a);
    const key=s.join("x")+"|"+p.mat+"|"+(p.orla||"")+"|"+p.nome.replace(/\b(esquerd[ao]|direit[ao]|esq\.|dir\.)\s*/gi,"").replace(/\s\d+(\/\d+)?$/,"").replace(/ gaveta \d+$/,"");
    if(!rows.has(key)) rows.set(key,{refs:[],nomes:[],qt:0,c:s[0],l:s[1],e:s[2],mat:p.mat,orla:p.orla,nota:p.nota||""});
    const r=rows.get(key); r.refs.push(p.code); r.nomes.push(p.nome); r.qt++;
  });
  return [...rows.values()];
}
function materialSummary(){
  const m=new Map();
  parts.filter(p=>p.tipo==="corte"&&!p.oculta).forEach(p=>{
    const s=[p.w,p.h,p.d].sort((a,b)=>b-a); const k=p.mat+"|"+R(s[2]);
    if(!m.has(k)) m.set(k,{nome:MATS[p.mat].nome,esp:R(s[2]),area:0}); m.get(k).area+=s[0]*s[1]/1e6;
  });
  return [...m.values()].map(r=>({nome:r.nome,esp:r.esp,m2:r.area*1.15,chapas:Math.max(1,Math.ceil(r.area*1.15/(2.44*1.22)))}));
}

let pr=null;
function renderSnapshot(kind,dir,w,h,opts){
  opts=opts||{};
  if(!pr){ pr=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); pr.setPixelRatio(2); }
  pr.setSize(w,h,false);
  let cam;
  const box=new THREE.Box3().setFromObject(group);
  if(kind==="ortho"){
    const d=new THREE.Vector3(...dir).normalize();
    const size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
    let vw,vh; if(Math.abs(d.z)>.9){vw=size.x;vh=size.y;} else if(Math.abs(d.x)>.9){vw=size.z;vh=size.y;} else {vw=size.x;vh=size.z;}
    const m=1.42; let hw=vw*m/2, hh=vh*m/2; if(hw/hh>w/h) hh=hw*h/w; else hw=hh*w/h;
    cam=new THREE.OrthographicCamera(-hw,hw,hh,-hh,1,100000);
    cam.position.copy(c).addScaledVector(d,20000);
    if(Math.abs(d.y)>.9) cam.up.set(0,0,-1);
    cam.lookAt(c); cam.updateProjectionMatrix();
  } else {
    cam=new THREE.PerspectiveCamera(30,w/h,10,100000);
    fitCamera(dir,cam,w/h);
    cam.position.sub(cam.position.clone().sub(box.getCenter(new THREE.Vector3())).multiplyScalar(opts.zoom!=null?opts.zoom:0));
  }
  pr.render(scene,cam);
  const cv=document.createElement("canvas"); cv.width=w*2; cv.height=h*2; const ctx=cv.getContext("2d");
  ctx.drawImage(pr.domElement,0,0);
  const P=(v)=>{ const q=new THREE.Vector3(v[0],v[1],v[2]).add(group.position).project(cam); return [(q.x+1)/2*cv.width,(1-q.y)/2*cv.height]; };
  if(opts.dims) opts.dims.forEach(dm=>drawDim(ctx,P(dm.a),P(dm.b),dm.off,dm.label));
  if(opts.labels){
    ctx.font="600 17px 'IBM Plex Mono', monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
    meshes.forEach(m=>{ const p=m.userData.part; if(p.tipo!=="corte") return;
      const wp=m.getWorldPosition(new THREE.Vector3()).project(cam); const x=(wp.x+1)/2*cv.width, y=(1-wp.y)/2*cv.height;
      const t=p.code.slice(1).replace(/^0/,""); const r=t.length>1?15:13;
      ctx.fillStyle="rgba(255,255,255,.92)"; ctx.strokeStyle="#1b140d"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#1b140d"; ctx.fillText(t,x,y+1); });
  }
  return cv.toDataURL("image/png");
}
function drawDim(ctx,A,B,off,label){
  const s=2; const ox=off[0]*s, oy=off[1]*s;
  const a=[A[0]+ox,A[1]+oy], b=[B[0]+ox,B[1]+oy];
  ctx.strokeStyle="#8c602a"; ctx.fillStyle="#8c602a"; ctx.lineWidth=2;
  const ext=(P,Q)=>{ const len=Math.hypot(Q[0]-P[0],Q[1]-P[1])||1; const ux=(Q[0]-P[0])/len, uy=(Q[1]-P[1])/len; ctx.beginPath(); ctx.moveTo(P[0]+ux*8,P[1]+uy*8); ctx.lineTo(Q[0]+ux*10,Q[1]+uy*10); ctx.stroke(); };
  ext(A,a); ext(B,b);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  [a,b].forEach(p=>{ ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(ang+Math.PI/4); ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0); ctx.lineWidth=3; ctx.stroke(); ctx.restore(); });
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
  ctx.save(); ctx.translate(mx,my); let rot=ang; if(rot>Math.PI/2) rot-=Math.PI; if(rot<-Math.PI/2) rot+=Math.PI; ctx.rotate(rot);
  ctx.font="600 22px 'IBM Plex Mono', monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const tw=ctx.measureText(label).width+14; ctx.fillStyle="#fff"; ctx.fillRect(-tw/2,-15,tw,30); ctx.fillStyle="#5b3d17"; ctx.fillText(label,0,1); ctx.restore();
}

  let p1="<section class='page'>"+header(1,3)+

    "<div><h2>Especificações</h2><div class='kv'>"+kv.map(r=>"<div><b>"+esc(r[0])+"</b><span>"+esc(String(r[1]))+"</span></div>").join("")+"</div></div>"+foot+"</section>";
  let funcs="";
  if(state.tpl==="estacao"){
    const g=GAVETAS.slice(0,p.nGavetas).map((x,i)=>"<li><b>Gaveta "+(i+1)+" — "+esc(x.nome)+":</b> "+esc(x.nota)+" ("+x.k+" divisões)</li>").join("");
    funcs="<div><h2>Organização das áreas</h2><ul class='steps'>"+g+
      (p.alcado?"<li><b>Alçado esquerdo:</b> "+p.nTemperos+" galheteiros com sal, pimenta, azeite e vinagre, prontos a levar às mesas</li><li><b>Alçado central:</b> guardanapos</li><li><b>Alçado direito:</b> "+p.nBaldes+" baldes de talheres para levar às mesas</li><li><b>Prateleira do alçado:</b> açucareiros, porta-palhinhas, porta-menus</li>":"")+
      "<li><b>Nicho aberto:</b> tabuleiros de serviço, jarros de água, cestos de pão</li>"+(p.portas?"<li><b>Armário com portas:</b> bules, menus, toalhas e reservas</li>":"")+"</ul></div>";
  }
  let p2="<section class='page'>"+header(2,3)+
    "<div><h2>Lista de corte</h2><div class='tblwrap'><table class='tbl'><thead><tr><th>Ref.</th><th>Peça</th><th>Qtd</th><th>Comp.</th><th>Larg.</th><th>Esp.</th><th>Material</th><th>Orla</th></tr></thead><tbody>"+
    cr.map(r=>"<tr><td class='num'>"+r.refs.join(", ")+"</td><td>"+esc(uniqName(r.nomes))+"</td><td class='n'>"+r.qt+"</td><td class='n'>"+fmt(r.c)+"</td><td class='n'>"+fmt(r.l)+"</td><td class='n'>"+r.e+"</td><td>"+esc(MATS[r.mat].nome)+"</td><td>"+esc(r.orla||"—")+"</td></tr>").join("")+
    "</tbody></table></div></div>"+
    foot+"</section><section class='page'>"+header(3,3)+
    "<div class='cols2'><div><h2>Ferragens</h2><table class='tbl'><tbody>"+hw.ferr.map(r=>"<tr><td>"+esc(r[0])+(r[2]?"<br><span style='color:#7a6a58'>"+esc(r[2])+"</span>":"")+"</td><td class='n'>"+r[1]+"</td></tr>").join("")+"</tbody></table>"+
    (hw.acc.length?"<h2 style='margin-top:5mm'>Acessórios de serviço</h2><table class='tbl'><tbody>"+hw.acc.map(r=>"<tr><td>"+esc(r[0])+"</td><td class='n'>"+r[1]+"</td></tr>").join("")+"</tbody></table>":"")+"</div>"+
    "<div><h2>Material (com 15% de desperdício)</h2><table class='tbl'><tbody>"+ms.map(r=>"<tr><td>"+esc(r.nome)+" "+r.esp+" mm</td><td class='n'>"+r.m2.toFixed(2)+" m²</td><td class='n'>"+r.chapas+" ch. 2440×1220</td></tr>").join("")+"</tbody></table>"+
    "<h2 style='margin-top:5mm'>Sequência de montagem</h2><ol class='steps'>"+T.passos.map(s=>"<li>"+esc(s)+"</li>").join("")+"</ol></div></div>"+
    funcs+foot+"</section>";
  $("pages").innerHTML=p1+p2;
  $("printHint").textContent="A4 vertical · 3 folhas";
  $("sheetWrap").hidden=false; $("sheetWrap").scrollTop=0;
}
function uniqName(n){ if(n.length===1) return n[0]; const base=n[0].replace(/\b(esquerd[ao]|direit[ao]|esq\.|dir\.)\s*/gi,"").replace(/\s\d+(\/\d+)?$/,"").replace(/ gaveta \d+$/," gaveta").trim(); return base.charAt(0).toUpperCase()+base.slice(1)+" ("+n.length+")"; }
function closeSheet(){ $("sheetWrap").hidden=true; }
$("btnSheet").addEventListener("click",openSheet);
$("btnCloseSheet").addEventListener("click",closeSheet);
const inFrame=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
if(inFrame){ $("btnPrint").hidden=true; }
$("printHint").textContent="A4 vertical · 3 folhas";
$("btnPrint").addEventListener("click",()=>window.print());

/* ===================== EXPORTAR PDF ===================== */
let pdfBusy=false, dlCap=null;
function getDownloads(){
  if(!dlCap){ const c=window.claude; dlCap = (c && typeof c.use==="function") ? c.use("downloads").catch(()=>null) : Promise.resolve(null); }
  return dlCap;
}
function pdfName(){
  const vis=parts.filter(p=>!p.oculta&&!p.invisivel), bb=bbox(vis);
  const slug=norm(TPL[state.tpl].nome).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return "7G-"+slug+"-"+R(bb.max[0]-bb.min[0])+"x"+R(bb.max[2]-bb.min[2])+"x"+R(bb.max[1]-Math.max(0,bb.min[1]))+".pdf";
}
async function exportPdf(){
  if(pdfBusy) return;
  const st=$("pdfStatus"), btns=[$("btnPdf"),$("btnPdfTop")];
  if(!window.jspdf || !window.html2canvas){ st.textContent="Não foi possível carregar o gerador de PDF. Verifica a ligação e recarrega a página."; return; }
  pdfBusy=true; btns.forEach(b=>b.disabled=true);
  if($("sheetWrap").hidden) openSheet();
  st.textContent="A gerar o PDF…";
  try{
    await (document.fonts && document.fonts.ready);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});
    const PW=210, PH=297;
    const pages=[...document.querySelectorAll("#pages .page")];
    let first=true;
    for(const pg of pages){
      const cv=await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:1400,
        onclone:(doc)=>{ const el=doc.getElementById("sheetWrap"); if(el){ el.style.position="static"; el.style.overflow="visible"; }
          doc.querySelectorAll(".page").forEach(p=>{ p.style.width="210mm"; p.style.maxWidth="none"; p.style.boxShadow="none"; }); }});
      // cada folha numa página A4; se for mais alta, reduz-se para caber
      let w=PW, h=cv.height*PW/cv.width;
      if(h>PH){ w=w*PH/h; h=PH; }
      if(!first) pdf.addPage(); first=false;
      pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",(PW-w)/2,0,w,h);
    }
    pdf.setProperties({title:TPL[state.tpl].nome+" — folha de construção",subject:summary(),creator:"Oficina de Móveis 7G"});
    const name=pdfName(), blob=pdf.output("blob");
    const dl=await getDownloads();
    if(dl){
      try{ await dl.save({filename:name,data:blob}); st.textContent="PDF guardado: "+name; }
      catch(e){ const c=e&&e.code;
        st.textContent = c==="declined" ? "Descarga cancelada." : c==="rate_limited" ? "Já há um pedido de descarga aberto. Tenta de novo daqui a pouco." : "Este visualizador não permite descarregar ficheiros. Abre o ficheiro oficina-moveis.html no navegador."; }
    } else if(inFrame){
      st.textContent="Este visualizador não permite descarregar ficheiros. Abre o ficheiro oficina-moveis.html no navegador.";
    } else { pdf.save(name); st.textContent="PDF descarregado: "+name; }
  }catch(e){ console.error(e); st.textContent="Não foi possível gerar o PDF ("+(e&&e.message||e)+")."; }
  finally{ pdfBusy=false; btns.forEach(b=>b.disabled=false); }
}
$("btnPdf").addEventListener("click",exportPdf);
$("btnPdfTop").addEventListener("click",exportPdf);

loop();

new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
